<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Card - DOM Manipulation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="cursor"></div>
        <div id="card">
            <img src="https://th.bing.com/th/id/OIP.rJcJgZNJ3ao4YImCEEAjUwHaE7?w=262&h=180&c=7&r=0&o=7&pid=1.7&rm=3" alt="Profile Image">
            <h1 id="name">Lakshya Nigam</h1>
            <h2 id="status">Stranger</h2>
            <div id="button">
                <button id="accept">Add Friend</button>
            </div>
            <i class="ri-heart-3-fill"></i>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
